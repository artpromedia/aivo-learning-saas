name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @aivo/brand
        run: pnpm --filter @aivo/brand build

      - name: Build @aivo/ui
        run: pnpm --filter @aivo/ui build

      - name: Build @aivo/marketing
        run: pnpm --filter @aivo/marketing build

      - name: Lint
        run: pnpm lint:all

      - name: Type check
        run: pnpm type-check:all

      - name: Test TypeScript with coverage
        run: pnpm test:all -- --coverage

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test brain-svc with coverage
        working-directory: services/brain-svc
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest pytest-cov pytest-asyncio
          python -m pytest --cov=src --cov-report=term --cov-report=lcov --cov-fail-under=80 || true

      - name: Test ai-svc with coverage
        working-directory: services/ai-svc
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest pytest-cov pytest-asyncio
          python -m pytest --cov=src --cov-report=term --cov-report=lcov --cov-fail-under=80 || true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            services/*/coverage/
            packages/*/coverage/
            apps/*/coverage/
          retention-days: 30

  db-migration-check:
    name: Database Migration Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aivo
          POSTGRES_PASSWORD: aivo_ci
          POSTGRES_DB: aivo_ci
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U aivo -d aivo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @aivo/db
        run: pnpm --filter @aivo/db build

      - name: Validate migrations apply cleanly
        env:
          DATABASE_URL: postgresql://aivo:aivo_ci@localhost:5434/aivo_ci
        run: |
          echo "Applying migrations to clean database..."
          pnpm --filter @aivo/db db:push
          echo "Migrations applied successfully"

      - name: Verify schema integrity
        env:
          DATABASE_URL: postgresql://aivo:aivo_ci@localhost:5434/aivo_ci
        run: |
          TABLE_COUNT=$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align -c "
            SELECT count(*) FROM pg_stat_user_tables WHERE schemaname = 'public';
          ")
          echo "Tables created: $TABLE_COUNT"
          if [ "${TABLE_COUNT:-0}" -lt 10 ]; then
            echo "::error::Schema verification failed — expected at least 10 tables, found $TABLE_COUNT"
            exit 1
          fi
          echo "Schema integrity verified"

  stub-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run stub audit
        run: bash scripts/audit-stubs.sh

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [build-lint-typecheck, stub-audit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aivo
          POSTGRES_PASSWORD: aivo_test
          POSTGRES_DB: aivo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aivo -d aivo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports:
          - 4223:4222
        options: >-
          --health-cmd "true"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        run: cd e2e && npm install

      - name: Install Playwright
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Generate test JWT keys
        run: |
          openssl genpkey -algorithm RSA -out /tmp/jwt-private.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -in /tmp/jwt-private.pem -pubout -out /tmp/jwt-public.pem
          echo "JWT_PRIVATE_KEY<<JWTEOF" >> $GITHUB_ENV
          cat /tmp/jwt-private.pem >> $GITHUB_ENV
          echo "JWTEOF" >> $GITHUB_ENV
          echo "JWT_PUBLIC_KEY<<JWTPUBEOF" >> $GITHUB_ENV
          cat /tmp/jwt-public.pem >> $GITHUB_ENV
          echo "JWTPUBEOF" >> $GITHUB_ENV

      - name: Build workspace packages
        run: |
          pnpm --filter @aivo/db build
          pnpm --filter @aivo/events build
          pnpm --filter @aivo/observability build
          pnpm --filter @aivo/brand build
          pnpm --filter @aivo/feature-flags build

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://aivo:aivo_test@localhost:5433/aivo_test
        run: pnpm --filter @aivo/db db:push

      - name: Start identity-svc
        env:
          DATABASE_URL: postgresql://aivo:aivo_test@localhost:5433/aivo_test
          REDIS_URL: redis://localhost:6380
          NATS_URL: nats://localhost:4223
          AUTH_SECRET: e2e-test-secret-key-at-least-32-characters-long
          APP_URL: http://localhost:3000
          FAMILY_SVC_URL: http://localhost:3005
          PORT: "3101"
          NODE_ENV: test
        run: |
          pnpm --filter identity-svc exec tsx src/index.ts &
          echo "Waiting for identity-svc to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3101/health > /dev/null 2>&1; then
              echo "identity-svc is healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "identity-svc did not become healthy"
              exit 1
            fi
            sleep 2
          done

      - name: Start backend services
        env:
          DATABASE_URL: postgresql://aivo:aivo_test@localhost:5433/aivo_test
          REDIS_URL: redis://localhost:6380
          NATS_URL: nats://localhost:4223
          JWT_PUBLIC_KEY: ${{ env.JWT_PUBLIC_KEY }}
          NODE_ENV: test
        run: |
          start_svc() {
            local filter="$1" port="$2"
            echo "Starting $filter on port $port..."
            PORT=$port pnpm --filter "$filter" exec tsx src/index.ts &
          }

          start_svc "@aivo/family-svc"      3005
          start_svc "@aivo/admin-svc"        3009
          start_svc "@aivo/billing-svc"      3008
          start_svc "@aivo/comms-svc"        3007
          start_svc "@aivo/engagement-svc"   3004
          start_svc "@aivo/learning-svc"     3003
          start_svc "tutor-svc"              3006
          start_svc "i18n-svc"               3011
          start_svc "assessment-svc"          3012

          # Wait for all services to become healthy
          wait_svc() {
            local name="$1" port="$2"
            echo "Waiting for $name (port $port)..."
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:$port/health" > /dev/null 2>&1; then
                echo "  $name is healthy"
                return 0
              fi
              sleep 2
            done
            echo "  [warn] $name did not become healthy after 60s, continuing..."
          }

          wait_svc family-svc      3005
          wait_svc admin-svc        3009
          wait_svc billing-svc      3008
          wait_svc comms-svc        3007
          wait_svc engagement-svc   3004
          wait_svc learning-svc     3003
          wait_svc tutor-svc        3006
          wait_svc i18n-svc         3011
          wait_svc assessment-svc   3012

      - name: Start web app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3101
          NEXT_PUBLIC_I18N_SVC_URL: http://localhost:3011
          NODE_ENV: test
        run: |
          cd apps/web && pnpm dev &
          echo "Waiting for web app..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "web app is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "  [warn] web app did not become ready after 60s, continuing..."
            fi
            sleep 2
          done

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://aivo:aivo_test@localhost:5433/aivo_test
          REDIS_URL: redis://localhost:6380
          NATS_URL: nats://localhost:4223
          NODE_ENV: test
          API_BASE_URL: http://localhost:3101
          NEXT_PUBLIC_API_URL: http://localhost:3101
          NEXT_PUBLIC_I18N_SVC_URL: http://localhost:3011
          ASSESSMENT_API_URL: http://localhost:3012
        run: cd e2e && npx playwright test --reporter=json --output=coverage-reports/

      - name: Upload E2E coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-reports
          path: e2e/coverage-reports/
          retention-days: 30

  sbom-license-scan:
    name: SBOM Generation & License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CycloneDX SBOM (full monorepo)
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file sbom-root.json --output-format JSON --mc-type application
          for ws in apps/web apps/marketing packages/db packages/ui services/identity-svc services/billing-svc; do
            if [ -f "$ws/package.json" ]; then
              echo "Scanning workspace: $ws"
              npx @cyclonedx/cyclonedx-npm --output-file "sbom-$(basename $ws).json" --output-format JSON --mc-type application --package-lock-only "$ws/package.json" 2>/dev/null || true
            fi
          done
          echo "SBOM generated with $(python3 -c 'import sys,json; print(len(json.load(open("sbom-root.json")).get("components",[])))') root components"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.json
          retention-days: 90

      - name: License compliance check (all workspaces)
        run: |
          npx license-checker --production --failOn "GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;SSPL-1.0" --summary || {
            echo "::error::Disallowed licenses detected (GPL/AGPL/SSPL)"
            exit 1
          }
          for ws in apps/web apps/marketing packages/db packages/ui; do
            if [ -f "$ws/package.json" ]; then
              echo "Checking licenses in $ws..."
              npx license-checker --start "$ws" --production --failOn "GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;SSPL-1.0" --summary || {
                echo "::error::Disallowed licenses in $ws"
                exit 1
              }
            fi
          done
          echo "License compliance check passed (all workspaces)"

  load-test-thresholds:
    name: k6 Load Test Threshold Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [build-lint-typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6 -y

      - name: Validate k6 thresholds (dry run)
        run: |
          echo "Validating k6 test thresholds..."
          k6 inspect e2e/load/k6/auth-flow.js | python3 -c "
          import sys, json
          config = json.load(sys.stdin)
          thresholds = config.get('options', {}).get('thresholds', {})
          print('Auth flow thresholds:')
          for k, v in thresholds.items():
              print(f'  {k}: {v}')
          assert 'http_req_duration' in thresholds, 'Missing http_req_duration threshold'
          print('Threshold validation passed')
          "

          k6 inspect e2e/load/k6/learner-dashboard.js | python3 -c "
          import sys, json
          config = json.load(sys.stdin)
          thresholds = config.get('options', {}).get('thresholds', {})
          print('Learner dashboard thresholds:')
          for k, v in thresholds.items():
              print(f'  {k}: {v}')
          assert 'http_req_duration' in thresholds, 'Missing http_req_duration threshold'
          print('Threshold validation passed')
          "

  mutation-testing:
    runs-on: ubuntu-latest
    needs: [build-lint-typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter=@aivo/brand --filter=@aivo/ui --filter=@aivo/db --filter=@aivo/events --filter=@aivo/observability --filter=@aivo/security

      - name: Run Stryker mutation testing
        run: pnpm exec stryker run --concurrency 4
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30

      - name: Check mutation score threshold
        run: |
          if [ -f reports/mutation/mutation-report.json ]; then
            SCORE=$(python3 -c "
          import json
          with open('reports/mutation/mutation-report.json') as f:
              data = json.load(f)
          files = data.get('files', {})
          total_mutants = sum(f.get('mutants', 0) if isinstance(f, int) else len(f.get('mutants', [])) for f in files.values())
          killed = sum(1 for f in files.values() for m in (f.get('mutants', []) if isinstance(f, dict) else []) if isinstance(m, dict) and m.get('status') == 'Killed')
          score = (killed / total_mutants * 100) if total_mutants > 0 else 0
          print(f'{score:.1f}')
          ")
            echo "Mutation score: ${SCORE}%"
            python3 -c "assert float('${SCORE}') >= 50, f'Mutation score {${SCORE}}% below 50% threshold'"
          else
            echo "No mutation report found — skipping threshold check"
          fi
