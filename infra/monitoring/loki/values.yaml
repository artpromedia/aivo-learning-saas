loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 720h  # 30 days hot storage
    max_query_length: 721h
    max_query_parallelism: 32
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 15MB
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /tmp/loki/retention
    compaction_interval: 10m
    retention_delete_delay: 2h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false

promtail:
  enabled: true
  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push
    snippets:
      pipelineStages:
        - cri: {}
        - json:
            expressions:
              level: level
              service: name
              trace_id: trace_id
              tenant_id: tenant_id
        - labels:
            level:
            service:
        - timestamp:
            source: time
            format: RFC3339Nano
      scrapeConfigs: |
        - job_name: kubernetes-pods
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_namespace]
              action: keep
              regex: aivo
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              target_label: app

grafanaDatasource:
  name: Loki
  type: loki
  url: http://loki:3100
  access: proxy
  isDefault: false
  jsonData:
    maxLines: 1000
