{{- if .Values.flagger.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: aivo-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: aivo-learning
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: aivo-tls-cert
      hosts:
        - {{ .Values.flagger.host | default "api.aivo.com" }}
        - {{ .Values.flagger.appHost | default "app.aivo.com" }}
    - port:
        number: 80
        name: http
        protocol: HTTP
      tls:
        httpsRedirect: true
      hosts:
        - {{ .Values.flagger.host | default "api.aivo.com" }}
        - {{ .Values.flagger.appHost | default "app.aivo.com" }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: aivo-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: aivo-learning
spec:
  hosts:
    - {{ .Values.flagger.host | default "api.aivo.com" }}
  gateways:
    - aivo-gateway
  http:
    - match:
        - uri:
            prefix: /api/auth
        - uri:
            prefix: /api/users
      route:
        - destination:
            host: identity-svc
            port:
              number: 3001
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: "5xx,reset,connect-failure"
    - match:
        - uri:
            prefix: /api/brain
      route:
        - destination:
            host: brain-svc
            port:
              number: 3002
      timeout: 15s
    - match:
        - uri:
            prefix: /api/learning
      route:
        - destination:
            host: learning-svc
            port:
              number: 3003
      timeout: 15s
    - match:
        - uri:
            prefix: /api/engagement
      route:
        - destination:
            host: engagement-svc
            port:
              number: 3004
      timeout: 10s
    - match:
        - uri:
            prefix: /api/family
      route:
        - destination:
            host: family-svc
            port:
              number: 3005
      timeout: 15s
    - match:
        - uri:
            prefix: /api/tutor
      route:
        - destination:
            host: tutor-svc
            port:
              number: 3006
      timeout: 30s
    - match:
        - uri:
            prefix: /api/billing
      route:
        - destination:
            host: billing-svc
            port:
              number: 3008
      timeout: 10s
    - match:
        - uri:
            prefix: /api/admin
      route:
        - destination:
            host: admin-svc
            port:
              number: 3009
      timeout: 10s
    - match:
        - uri:
            prefix: /api/integrations
      route:
        - destination:
            host: integrations-svc
            port:
              number: 3010
      timeout: 15s
    - match:
        - uri:
            prefix: /api/ai
      route:
        - destination:
            host: ai-svc
            port:
              number: 5000
      timeout: 60s
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: aivo-circuit-breaker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: aivo-learning
spec:
  host: "*.{{ .Release.Namespace }}.svc.cluster.local"
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        h2UpgradePolicy: DEFAULT
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
{{- end }}
