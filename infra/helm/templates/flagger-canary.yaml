{{- if .Values.flagger.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: aivo-learning
spec:
  provider: istio
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  progressDeadlineSeconds: {{ $.Values.flagger.progressDeadline | default 600 }}
  service:
    port: {{ $svc.port }}
    targetPort: {{ $svc.port }}
    gateways:
      - {{ $.Values.flagger.gateway | default "istio-system/aivo-gateway" }}
    hosts:
      - {{ $.Values.flagger.host | default "api.aivo.com" }}
    trafficPolicy:
      tls:
        mode: ISTIO_MUTUAL
  analysis:
    interval: {{ $.Values.flagger.analysis.interval | default "60s" }}
    threshold: {{ $.Values.flagger.analysis.threshold | default 5 }}
    maxWeight: {{ $.Values.flagger.analysis.maxWeight | default 50 }}
    stepWeight: {{ $.Values.flagger.analysis.stepWeight | default 10 }}
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: {{ $.Values.flagger.analysis.successRateMin | default 99 }}
        interval: 60s
      - name: request-duration
        thresholdRange:
          max: {{ $.Values.flagger.analysis.latencyMax | default 500 }}
        interval: 60s
    webhooks:
      {{- if $.Values.flagger.smokeTest.enabled }}
      - name: smoke-test
        type: pre-rollout
        url: {{ $.Values.flagger.smokeTest.url | default "http://flagger-loadtester.istio-system/" }}
        timeout: 60s
        metadata:
          type: bash
          cmd: "curl -sf http://{{ $name }}-canary.{{ $.Release.Namespace }}:{{ $svc.port }}/health"
      {{- end }}
      {{- if $.Values.flagger.loadTest.enabled }}
      - name: load-test
        type: rollout
        url: {{ $.Values.flagger.loadTest.url | default "http://flagger-loadtester.istio-system/" }}
        timeout: 60s
        metadata:
          type: cmd
          cmd: "hey -z 30s -q 5 -c 2 http://{{ $name }}-canary.{{ $.Release.Namespace }}:{{ $svc.port }}/health"
      {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
