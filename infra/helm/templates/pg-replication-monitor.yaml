{{- if .Values.database.replication.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-replication-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pg-replication-monitor
    app.kubernetes.io/part-of: aivo-learning
data:
  check-replication.sh: |
    #!/bin/bash
    set -e

    PRIMARY_HOST="{{ .Values.database.host }}"
    REPLICA_HOST="{{ .Values.database.replication.replicaHost }}"
    DB_USER="{{ .Values.database.user | default "aivo" }}"

    echo "=== PostgreSQL Replication Status ==="
    echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

    # Check primary replication status
    echo ""
    echo "--- Primary (${PRIMARY_HOST}) ---"
    PGPASSWORD="${DB_PASSWORD}" psql -h "${PRIMARY_HOST}" -U "${DB_USER}" -d aivo -t -c "
      SELECT
        client_addr,
        state,
        sent_lsn,
        write_lsn,
        flush_lsn,
        replay_lsn,
        pg_wal_lsn_diff(sent_lsn, replay_lsn) AS replay_lag_bytes,
        sync_state
      FROM pg_stat_replication;
    " 2>/dev/null || echo "ERROR: Cannot connect to primary"

    # Check replica status
    echo ""
    echo "--- Replica (${REPLICA_HOST}) ---"
    PGPASSWORD="${DB_PASSWORD}" psql -h "${REPLICA_HOST}" -U "${DB_USER}" -d aivo -t -c "
      SELECT
        pg_is_in_recovery() AS is_replica,
        pg_last_wal_receive_lsn() AS received_lsn,
        pg_last_wal_replay_lsn() AS replayed_lsn,
        pg_last_xact_replay_timestamp() AS last_replay_time,
        CASE
          WHEN pg_last_wal_receive_lsn() = pg_last_wal_replay_lsn() THEN 0
          ELSE EXTRACT(EPOCH FROM now() - pg_last_xact_replay_timestamp())
        END AS lag_seconds;
    " 2>/dev/null || echo "ERROR: Cannot connect to replica"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-replication-check
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pg-replication-monitor
    app.kubernetes.io/part-of: aivo-learning
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: replication-check
              image: postgres:16
              command: ["/bin/bash", "/scripts/check-replication.sh"]
              env:
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.secretName | default "aivo-db-credentials" }}
                      key: password
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: pg-replication-monitor
                defaultMode: 0755
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pg-replication-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pg-replication-monitor
    app.kubernetes.io/part-of: aivo-learning
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: postgresql-replication
      interval: 30s
      rules:
        - alert: PostgreSQLReplicationLagHigh
          expr: pg_replication_lag_seconds > 30
          for: 5m
          labels:
            severity: warning
            service: postgresql
          annotations:
            summary: "PostgreSQL replication lag is high"
            description: "Replication lag is {{ "{{ $value }}" }} seconds (threshold: 30s)"
            runbook: "docs/runbooks/database-failover.md"

        - alert: PostgreSQLReplicationLagCritical
          expr: pg_replication_lag_seconds > 300
          for: 2m
          labels:
            severity: critical
            service: postgresql
          annotations:
            summary: "PostgreSQL replication lag is critical"
            description: "Replication lag is {{ "{{ $value }}" }} seconds (threshold: 300s). Consider failover."
            runbook: "docs/runbooks/database-failover.md"

        - alert: PostgreSQLReplicaDown
          expr: pg_stat_replication_connected == 0
          for: 1m
          labels:
            severity: critical
            service: postgresql
          annotations:
            summary: "PostgreSQL replica is disconnected"
            description: "No streaming replication connections detected on primary."
            runbook: "docs/runbooks/database-failover.md"

        - alert: PostgreSQLReplicationSlotInactive
          expr: pg_replication_slot_active == 0
          for: 5m
          labels:
            severity: warning
            service: postgresql
          annotations:
            summary: "PostgreSQL replication slot is inactive"
            description: "Replication slot {{ "{{ $labels.slot_name }}" }} is inactive."
{{- end }}
